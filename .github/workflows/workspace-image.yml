name: Workspace image

on:
  push:
    branches: [main]
    paths:
      - 'packages/remote-host/**'
      - 'packages/chrome-stream/**'
      - 'src-tauri/src/preview_picker.js'
      - 'packages/agent-hook/**'
      - 'src-tauri/src/bin/canopy_hook.rs'
      - 'src-tauri/src/agent_instructions.rs'
      - 'src-tauri/src/agent_life.rs'
      - 'shared/agentLife/**'
      - 'src/teamMessaging/**'
      - 'packages/control-plane/lib/peer-messaging.mjs'
      - '.github/workflows/workspace-image.yml'
  workflow_dispatch:
    inputs:
      promote:
        description: 'Make this tested image the stable workspace release'
        type: boolean
        default: true

concurrency:
  group: workspace-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Test and publish (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci --prefix packages/remote-host --workspaces=false --ignore-scripts
      - run: node --test packages/remote-host/*.test.mjs
      - run: node packages/remote-host/prepare-hook-build.mjs
      - run: node packages/remote-host/prepare-browser-build.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate locally
        uses: docker/build-push-action@v6
        with:
          context: packages/remote-host
          load: true
          tags: canopy-workspace:0.1.0
          cache-from: type=gha,scope=workspace-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=workspace-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify actual candidate runtime and integrations
        run: |
          docker run --rm --network none -v "$PWD/packages/remote-host/browser-smoke.mjs:/opt/canopy/browser-smoke.mjs:ro" --entrypoint node canopy-workspace:0.1.0 /opt/canopy/browser-smoke.mjs
          node packages/remote-host/smoke-linux.mjs
          node packages/remote-host/smoke-agent-integrations.mjs canopy-workspace:0.1.0
          CANOPY_WORKSPACE_IMAGE=canopy-workspace:0.1.0 node packages/remote-host/smoke-cli-compatibility.mjs
          CANOPY_WORKSPACE_IMAGE=canopy-workspace:0.1.0 node packages/remote-host/smoke-peer-direct.mjs
          bash packages/remote-host/smoke-isolation.sh canopy-workspace:0.1.0
          node packages/remote-host/smoke-project-sharing.mjs canopy-workspace:0.1.0
          node packages/remote-host/smoke-member-revocation.mjs canopy-workspace:0.1.0
          node packages/remote-host/smoke-project-migration.mjs canopy-workspace:0.1.0
          node packages/remote-host/smoke-migration-recovery.mjs canopy-workspace:0.1.0
          node packages/remote-host/smoke-image-upgrade.mjs canopy-workspace:0.1.0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name tested architecture
        id: publish-name
        run: echo "image=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/canopy-workspace:sha-${{ github.sha }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
      # Same build as the tested image (every step is a cache hit), published
      # with zstd layers: hosts decompress zstd several times faster than gzip.
      - name: Publish tested architecture
        uses: docker/build-push-action@v6
        with:
          context: packages/remote-host
          cache-from: type=gha,scope=workspace-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.publish-name.outputs.image }},push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true

  # The release is assembled only after the runtime package built from this
  # commit has booted a replica of a managed host (test/host-replica): the real
  # control plane (canopy-website main), the real generated bootstrap, systemd,
  # nested Docker and the image pulled by digest, then a stop and a resume of
  # the existing workspace. Same packaging as the release job below.
  host-replica:
    name: Replica host boot (resume)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FluidWorksApp/canopy-website
          ref: main
          path: canopy-website
          token: ${{ secrets.CANOPY_WEBSITE_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Package this commit's host runtime
        run: |
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/canopy-workspace:sha-${{ github.sha }}-amd64"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "REPLICA_IMAGE=${image%:*}@$digest" >> "$GITHUB_ENV"
          mkdir -p replica-runtime
          node --input-type=module -e 'import fs from "node:fs";import {createHash} from "node:crypto";import {runtimeReleaseKey} from "./packages/remote-host/runtime-release-key.mjs";fs.writeFileSync("replica-runtime/workspace-release.json",JSON.stringify({revision:process.env.GITHUB_SHA,runtimeLockSha256:createHash("sha256").update(fs.readFileSync("packages/remote-host/package-lock.json")).digest("hex"),checks:{linuxAmd64:true,linuxArm64:true},runtimeKey:runtimeReleaseKey(process.env.GITHUB_SHA)}))'
          node packages/remote-host/prepare-browser-build.mjs
          bash packages/remote-host/package-host-release.sh replica-runtime/workspace-host.tar.gz replica-runtime/workspace-release.json
      - name: Boot, stop and resume a managed host replica
        run: npm run replica -- --runtime replica-runtime --image "$REPLICA_IMAGE" --website-dir canopy-website --scenario resume --cache "$RUNNER_TEMP/canopy-replica"
      - name: Keep replica evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-replica-${{ github.sha }}
          path: ${{ runner.temp }}/canopy-replica/runs
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish multi-platform release
    needs: [build, host-replica]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble immutable release after both platforms pass
        env:
          REVISION: ${{ github.sha }}
        run: |
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/canopy-workspace"
          docker buildx imagetools create --tag "$image:sha-$REVISION" "$image:sha-$REVISION-amd64" "$image:sha-$REVISION-arm64"
          docker buildx imagetools inspect "$image:sha-$REVISION" --format '{{json .Manifest}}' > image-manifest.json
          IMAGE="$image" node --input-type=module -e 'import fs from "node:fs";import {createHash} from "node:crypto";import {runtimeReleaseKey} from "./packages/remote-host/runtime-release-key.mjs";const m=JSON.parse(fs.readFileSync("image-manifest.json"));if(!/^sha256:[a-f0-9]{64}$/.test(m.digest))throw Error("Missing image digest");fs.writeFileSync("workspace-release.json",JSON.stringify({revision:process.env.REVISION,runtimeLockSha256:createHash("sha256").update(fs.readFileSync("packages/remote-host/package-lock.json")).digest("hex"),checks:{linuxAmd64:true,linuxArm64:true},runtimeKey:runtimeReleaseKey(process.env.REVISION),image:process.env.IMAGE+"@"+m.digest,channel:process.env.IMAGE+":stable",platforms:["linux/amd64","linux/arm64"]},null,2));'
          cat workspace-release.json >> "$GITHUB_STEP_SUMMARY"
      - name: Package matching trusted host runtime
        run: |
          node packages/remote-host/prepare-browser-build.mjs
          bash packages/remote-host/package-host-release.sh workspace-host.tar.gz workspace-release.json
          sha256sum workspace-host.tar.gz > workspace-host.tar.gz.sha256
      # The archive is uploaded (and can reach S3/production) only after this
      # exact archive booted like a managed host: root image step, then
      # canopy-host as its own user under the shipped units, staying active.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Boot the packaged runtime like a managed host
        run: sudo env "PATH=$PATH" bash packages/remote-host/smoke-host-boot.sh workspace-host.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-release-${{ github.sha }}
          path: |
            workspace-release.json
            workspace-host.tar.gz
            workspace-host.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Promote stable only after host validation and artifact upload succeed
        env:
          PROMOTE: ${{ github.event_name == 'push' || inputs.promote }}
        run: |
          if [[ "$PROMOTE" == true && "$GITHUB_REF" == refs/heads/main ]]; then
            image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/canopy-workspace"
            release=$(IMAGE="$image" node --input-type=module -e 'import fs from "node:fs";const m=JSON.parse(fs.readFileSync("workspace-release.json"));if(!m.image?.startsWith(process.env.IMAGE+"@sha256:")||!/^sha256:[a-f0-9]{64}$/.test(m.image.split("@")[1]))throw Error("Missing verified release digest");process.stdout.write(m.image);')
            docker buildx imagetools create --tag "$image:stable" "$release"
          fi
