name: Terminal compare

# Report-only measurement harness (bench/terminal-compare): xterm.js against
# canopy-term-core. Nothing here gates a merge or ships in the app.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bench/terminal-compare/**"
      - ".github/workflows/terminal-compare.yml"
      - ".github/actions/ghostty-vendor/**"

permissions:
  contents: read

jobs:
  compare:
    name: Terminal compare (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest now resolves to Ubuntu 26.04, which Playwright 1.56.1
        # cannot install Chromium on, so Linux is pinned to 24.04.
        include:
          - os: ubuntu-24.04
            zig_target: x86_64-linux
            zig_sha256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
          - os: macos-15
            zig_target: aarch64-macos
            zig_sha256: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
    defaults:
      run:
        shell: bash
        working-directory: bench/terminal-compare
    env:
      # canopy-term-core is built on libghostty-vt, whose build script runs
      # `zig build`; same pin and checksums as the Terminal crates job in ci.yml.
      ZIG_VERSION: 0.15.2
      RESULTS: ${{ github.workspace }}/bench-results
      STREAMS: ${{ github.workspace }}/bench-results/streams
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bench/terminal-compare/package-lock.json

      - name: Install Zig ${{ env.ZIG_VERSION }} (official release, checksum verified)
        run: |
          set -euo pipefail
          f="zig-${{ matrix.zig_target }}-${ZIG_VERSION}.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://ziglang.org/download/${ZIG_VERSION}/$f"
          echo "${{ matrix.zig_sha256 }}  $RUNNER_TEMP/$f" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@1.92.0

      - name: Ghostty source and Zig package cache (no network clone in the build)
        uses: ./.github/actions/ghostty-vendor

      - uses: swatinem/rust-cache@v2.8.0
        with:
          workspaces: bench/terminal-compare/engine

      - name: Build the engine bench (release)
        run: cargo build --release --locked --manifest-path engine/Cargo.toml

      - name: Install npm dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Install Chromium for Playwright
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: Write the shared byte streams
        run: |
          mkdir -p "$RESULTS"
          engine/target/release/terminal-compare-engine dump "$STREAMS"

      - name: Ours (canopy-term-core Screen::advance)
        run: |
          engine/target/release/terminal-compare-engine throughput "$STREAMS" "$RESULTS/ours.json"
          engine/target/release/terminal-compare-engine mem "$RESULTS/ours-mem.json"

      - name: xterm.js headless (Node)
        run: |
          node scripts/headless.mjs throughput "$STREAMS" "$RESULTS/headless.json"
          node scripts/headless.mjs mem "$RESULTS/headless-mem.json"

      - name: xterm.js in headless Chromium
        continue-on-error: true
        run: |
          node scripts/chromium.mjs throughput "$STREAMS" "$RESULTS/chromium.json"
          node scripts/chromium.mjs mem "$RESULTS/chromium-mem.json"

      - name: Report
        if: always()
        run: |
          node scripts/report.mjs "$RESULTS" "${{ matrix.os }}" | tee "$RESULTS/report.md"
          cat "$RESULTS/report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: terminal-compare-${{ matrix.os }}
          path: |
            bench-results/*.json
            bench-results/report.md
          retention-days: 14
