# Builds and releases Canopy for macOS and Linux.
#
# Tauri cannot cross-compile between operating systems (the linkers and the
# system webview are native), so each OS builds on its own runner. Windows and
# the Homebrew cask are deliberately not here yet.
#
# Trigger: push a tag (`git tag v0.1.0 && git push --tags`), or run it by hand
# from the Actions tab to get artifacts without cutting a release.
#
# Terminal app dry run: run it by hand with `term_app_dry_run` ticked to prove
# that canopy-term-app and canopy-pty-host build for every platform the release
# will bundle them on. Only the `term-app-dry-run` job runs; no tag, no draft,
# no signing, no upload.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_notarization:
        description: 'Build signed macOS installers without notarization (release notes must disclose this)'
        type: boolean
        default: false
      publish:
        description: 'Publish only after all platforms and updater signatures have been verified'
        type: boolean
        default: false
      term_app_dry_run:
        description: 'Dry run: only build and verify canopy-term-app (no tag, no signing, no publish; the release jobs are skipped)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# preflight creates the draft release; tauri-action uploads assets into it.
permissions:
  contents: write

jobs:
  preflight:
    # inputs.* is empty on a tag push, so this is true there.
    if: ${{ !inputs.term_app_dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release boundary regression checks
        run: node --test scripts/release-assets.test.mjs scripts/workspace-host-release.test.mjs scripts/workspace-host-fingerprint.test.mjs
      # Also creates the one draft release, before the build matrix starts, so
      # the jobs' uploads cannot race into separate drafts. Needs this
      # version's docs/releases/<version>.md, so missing notes fail here.
      - name: Reject published targets and create the single draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANOPY_RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-assets.mjs --preflight

  # Proves the terminal app builds where the release will bundle it, without
  # cutting a release. workflow_dispatch only, and only with term_app_dry_run
  # ticked. It uses no secrets (not even GITHUB_TOKEN beyond checkout), never
  # signs (so macOS signing and notarisation are NOT exercised here), creates no
  # tag or draft, and uploads nothing to a release. Intel macOS is a cross
  # build from the arm64 runner with the arm64 Zig, like the release build.
  term-app-dry-run:
    name: Terminal app dry run (${{ matrix.target }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.term_app_dry_run }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15, not macos-latest: macos-latest is now macOS 26, and Zig
          # 0.15.2 cannot link against its SDK (libghostty-vt-sys fails with
          # undefined libc symbols: _abort, _bzero, _clock_gettime; seen in
          # dry run 43159356455). macos-15 is what ci.yml's term-app job uses.
          - platform: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - platform: macos-15
            target: x86_64-apple-darwin
            arch: x86_64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86-64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/install-zig
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./crates/canopy-term-app -> target
          key: release-term-app-${{ matrix.target }}
      - name: Toolchain versions
        run: |
          echo "zig $(zig version)"
          rustc --version
          cargo --version
      - name: Build canopy-term-app
        run: cargo build --locked --release --target ${{ matrix.target }} --manifest-path crates/canopy-term-app/Cargo.toml
      - name: Build canopy-pty-host
        run: cargo build --locked --release --target ${{ matrix.target }} --manifest-path crates/canopy-pty-host/Cargo.toml --bin canopy-pty-host
      - name: Verify the binaries
        shell: bash
        run: |
          set -euo pipefail
          app="crates/canopy-term-app/target/${{ matrix.target }}/release/canopy-term-app"
          host="src-tauri/target/${{ matrix.target }}/release/canopy-pty-host"
          for b in "$app" "$host"; do
            [ -s "$b" ] || { echo "::error::$b is missing or empty"; exit 1; }
            ls -l "$b"
            file "$b"
            # The architecture must be the target's, not the runner's.
            if [ "$RUNNER_OS" = "macOS" ]; then
              archs="$(lipo -archs "$b")"
              [ "$archs" = "${{ matrix.arch }}" ] || { echo "::error::$b is $archs, expected ${{ matrix.arch }}"; exit 1; }
            else
              file "$b" | grep -q "${{ matrix.arch }}" || { echo "::error::$b is not ${{ matrix.arch }}"; exit 1; }
            fi
          done
          # Sizes go to the job summary: the bundle grows by about this much.
          {
            echo "### ${{ matrix.target }}"
            echo '| binary | bytes |'
            echo '| --- | --- |'
            echo "| canopy-term-app | $(wc -c < "$app" | tr -d ' ') |"
            echo "| canopy-pty-host | $(wc -c < "$host" | tr -d ' ') |"
          } >> "$GITHUB_STEP_SUMMARY"
          # No window is opened: this checks the binary loads and parses
          # arguments. The Intel macOS binary runs under Rosetta where the runner
          # has it; if it cannot run there, say so rather than fail the build.
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            if arch -x86_64 "$app" --version; then
              echo "Intel binary ran under Rosetta."
            else
              echo "::warning::could not run the Intel binary on this arm64 runner; only its architecture was verified."
            fi
          else
            "$app" --version
          fi

  build:
    needs: preflight
    strategy:
      # One platform failing shouldn't bin the artifacts of the others.
      fail-fast: false
      matrix:
        include:
          # macOS: both arches, built on the arm64 runner. arm64 ships the full
          # app; Intel (x86_64-apple-darwin) ships with dictation compiled out
          # (--no-default-features) — ONNX Runtime has no osx-x86_64 build past
          # v1.23.0, below the >= v1.24 the ort crate needs, so the ASR stack
          # can't run there. The Intel build pulls no ONNX deps and stages no
          # dylib; the ONNX steps below skip it.
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --features desk-native --config src-tauri/tauri.release-macos.conf.json"
          - platform: macos-latest
            target: x86_64-apple-darwin
            # `--` hands --no-default-features to cargo; `tauri build` has no such
            # flag of its own and errors on it otherwise.
            args: "--target x86_64-apple-darwin --config src-tauri/tauri.release-macos.conf.json -- --no-default-features --features desk-native"
          # 22.04, not latest: the glibc you build against is the *floor* for
          # what users can run. Building on 24.04 would exclude 22.04 users.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          # Windows: NSIS only. `targets: "all"` would also attempt an MSI via
          # WiX, whose light.exe fails on the runner — and NSIS is the format
          # the updater is configured for (installMode: passive) anyway.
          # Unsigned for now — SmartScreen warns until an Authenticode
          # certificate is added.
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc --bundles nsis --features desk-native"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            xdg-utils \
            build-essential \
            curl wget file libssl-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - run: npm ci

      # Import the signing certificate ourselves instead of letting Tauri do it.
      # Tauri's importer rejects any .p12 holding more than one identity
      # ("certificate from APPLE_CERTIFICATE ... does not match provided
      # identity"), and a Keychain Access / `security export` .p12 often carries
      # every identity in the login keychain. Importing here and signing purely
      # by APPLE_SIGNING_IDENTITY name sidesteps that: codesign picks the right
      # identity out of the keychain no matter what else the .p12 contains.
      - name: Import Apple signing certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set — building unsigned."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 24)"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          # Lets codesign use the key without an interactive password prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

          # Fail here with a clear message rather than deep inside `tauri build`
          # if the identity the secrets name isn't actually in the .p12.
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | grep -qF "$APPLE_SIGNING_IDENTITY"; then
            echo "::error::APPLE_SIGNING_IDENTITY not found in the imported .p12."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "Identity present in keychain."

      # ONNX Runtime is loaded dynamically on EVERY target (ort load-dynamic, see
      # Cargo.toml), so every build ships Microsoft's official runtime as an app
      # resource (bundle.resources: onnxruntime/* -> lib.rs sets ORT_DYLIB_PATH to
      # it). One mechanism everywhere avoids both static-prebuilt failures: no ort
      # prebuilt for some targets, and the Linux prebuilt needs a too-new glibc.
      # v1.24.2 satisfies ort rc.12, whose default api-24 feature requires ONNX
      # Runtime >= v1.24 — a lower runtime deadlocks ort's init. Intel macOS is
      # not built (no osx-x86_64 build exists past v1.23.0; see the build matrix).
      - name: Stage ONNX Runtime (all platforms, for load-dynamic)
        shell: bash
        run: |
          ORT_VER=1.24.2
          # Intel macOS builds dictation out — no ONNX Runtime to stage. Leave a
          # marker so the bundle.resources `onnxruntime/*` glob still matches, and
          # skip the rest.
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            mkdir -p src-tauri/onnxruntime
            echo "Dictation is unavailable on Intel macOS (no compatible ONNX Runtime)." \
              > src-tauri/onnxruntime/DICTATION_UNSUPPORTED.txt
            echo "Intel macOS: dictation disabled — no ONNX Runtime staged."
            exit 0
          fi
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)     A=osx-arm64;  EXT=tgz; IN=libonnxruntime.${ORT_VER}.dylib; OUT=libonnxruntime.dylib ;;
            x86_64-unknown-linux-gnu) A=linux-x64;  EXT=tgz; IN=libonnxruntime.so.${ORT_VER};    OUT=libonnxruntime.so ;;
            x86_64-pc-windows-msvc)   A=win-x64;    EXT=zip; IN=onnxruntime.dll;                 OUT=onnxruntime.dll ;;
            *) echo "::error::unmapped target ${{ matrix.target }}"; exit 1 ;;
          esac
          PKG="onnxruntime-${A}-${ORT_VER}"
          # Work entirely in the checkout with RELATIVE paths. Absolute paths on
          # the Windows runner ($RUNNER_TEMP = D:\a\_temp) break two ways under
          # git-bash: backslashes get eaten, and tar reads the `D:` drive letter
          # as a remote host:path ("Cannot connect to D:"). Relative paths dodge
          # both. Downloads/extraction are scratch and removed before the build.
          curl -fSL -o "ort.${EXT}" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/${PKG}.${EXT}"
          # tgz: GNU tar (Linux) + bsdtar (macOS). zip: bsdtar (Windows/macOS).
          # tgz: GNU tar (Linux) / bsdtar (macOS). zip (Windows only): git-bash's
          # GNU tar can't read zip, so use PowerShell's built-in Expand-Archive.
          if [ "$EXT" = zip ]; then
            powershell -NoProfile -Command "Expand-Archive -Force -Path ort.zip -DestinationPath ."
          else
            tar -xzf "ort.${EXT}"
          fi
          mkdir -p src-tauri/onnxruntime
          cp "${PKG}/lib/${IN}" "src-tauri/onnxruntime/${OUT}"
          # Linux/Windows CPU builds ship a providers_shared lib next to the main
          # one; copy it alongside (macOS has none). Harmless if unused, and it
          # avoids a load failure if ort probes for it.
          cp "${PKG}"/lib/*providers_shared* "src-tauri/onnxruntime/" 2>/dev/null || true
          rm -rf "${PKG}" "ort.${EXT}"
          echo "Staged ONNX Runtime ${ORT_VER} (${A}):"; ls -la src-tauri/onnxruntime/

      # Microsoft ships the macOS ONNX Runtime dylib ad-hoc-signed since v1.24
      # (1.23 was Developer ID + timestamped). tauri does not re-sign bundle
      # resources, and an ad-hoc-signed nested binary fails notarisation — so the
      # whole .app would be rejected. Re-sign it with our Developer ID, hardened
      # runtime, and a secure timestamp, exactly like every other binary we ship.
      - name: Re-sign bundled ONNX Runtime (macOS, for notarisation)
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY not set — leaving ONNX Runtime as-is (unsigned build)."
            exit 0
          fi
          codesign --force --timestamp --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" src-tauri/onnxruntime/libonnxruntime.dylib
          codesign --verify --strict src-tauri/onnxruntime/libonnxruntime.dylib
          echo "Re-signed ONNX Runtime:"
          codesign -dvvv src-tauri/onnxruntime/libonnxruntime.dylib 2>&1 \
            | grep -E "Authority=Developer ID|Timestamp=|flags=.*runtime" || true

      - name: Read rolled-up release notes
        id: release-notes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, existsSync, appendFileSync} from 'node:fs';
          const {version} = JSON.parse(readFileSync('package.json', 'utf8'));
          const path = `docs/releases/${version}.md`;
          const body = existsSync(path) ? readFileSync(path, 'utf8').trim() : 'See the assets below to download and install.';
          appendFileSync(process.env.GITHUB_OUTPUT, `body<<CANOPY_RELEASE_NOTES\n${body}\nCANOPY_RELEASE_NOTES\n`);
          NODE

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts. Without this the build still succeeds but
          # produces no .sig, and installed copies will refuse the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple signing + notarisation. The certificate itself is imported by
          # the "Import Apple signing certificate" step above — passing
          # APPLE_CERTIFICATE here would re-trigger Tauri's own import, which
          # chokes on a .p12 with more than one identity. Only the identity
          # name is passed; codesign resolves it from the imported keychain.
          # When these are unset the mac build is unsigned: it runs here, but
          # Gatekeeper blocks it on other people's machines.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ !inputs.skip_notarization && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ !inputs.skip_notarization && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Canopy __VERSION__"
          releaseBody: ${{ steps.release-notes.outputs.body }}
          # Draft: a release is public the moment it publishes, and the tag is
          # the only gate. Review before it reaches anyone.
          releaseDraft: true
          prerelease: false
          # Writes latest.json, which plugins.updater.endpoints points at.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # tauri-bundler signs every externalBin entry with the app's entitlements
      # (one set for all, no per-binary setting), which would hand the PTY host
      # JIT, library-validation-off, DYLD and microphone rights it does not
      # need. So on macOS the host is not an externalBin: prepare-sidecar.mjs
      # signs it with src-tauri/pty-host-entitlements.plist (during the build,
      # before anything is bundled or uploaded, and failing the build if codesign
      # fails) and tauri.release-macos.conf.json copies it into
      # Contents/MacOS, which the bundler does not re-sign. The app copies it out
      # of the bundle and runs it from there (pty_hosted/install.rs).
      #
      # This step checks what shipped. Signing is expected whenever
      # APPLE_CERTIFICATE is set (an unsigned build is the one supported way to
      # run without it); then a missing identity, a missing host, or any
      # entitlement on the host fails the job. It runs after tauri-action has
      # uploaded to the draft release, which stays a draft until published.
      - name: Verify the PTY host sidecar is signed (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE not set: unsigned build, nothing to verify."
            exit 0
          fi
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::APPLE_CERTIFICATE is set but APPLE_SIGNING_IDENTITY is not, so the build was not signed as intended."
            exit 1
          fi
          root="src-tauri/target/${{ matrix.target }}/release/bundle"
          [ -d "$root" ] || root="src-tauri/target/release/bundle"
          host="$(find "$root/macos" -path '*.app/Contents/MacOS/canopy-pty-host' | head -1)"
          if [ -z "$host" ]; then
            echo "::error::canopy-pty-host is missing from the app bundle."
            exit 1
          fi
          codesign --verify --strict --verbose=2 "$host"
          info="$(codesign -dvvv "$host" 2>&1)"
          echo "$info" | grep -E "Authority=|Timestamp=|flags=" || true
          # Hardened runtime and a secure timestamp are what notarisation needs
          # of the copy that runs from ~/.canopy.
          echo "$info" | grep -E "flags=.*\(runtime\)" >/dev/null \
            || { echo "::error::canopy-pty-host is not signed with the hardened runtime."; exit 1; }
          echo "$info" | grep -E "^Timestamp=" >/dev/null \
            || { echo "::error::canopy-pty-host has no secure timestamp."; exit 1; }
          # No entitlement at all (src-tauri/pty-host-entitlements.plist).
          ents="$(codesign -d --entitlements - --xml "$host")" \
            || { echo "::error::could not read the entitlements of canopy-pty-host."; exit 1; }
          echo "$ents"
          if echo "$ents" | grep -q "<key>"; then
            echo "::error::canopy-pty-host carries entitlements; it must carry none."
            exit 1
          fi

      # `tauri build` exits 0 even when signing fails ("a public key has been
      # found, but no private key"), so a missing or bad secret would publish a
      # release whose update artifacts have no .sig — and every installed copy
      # would silently refuse to update. Fail here instead.
      - name: Verify updater artifacts are signed
        shell: bash
        run: |
          root="src-tauri/target/${{ matrix.target }}/release/bundle"
          [ -d "$root" ] || root="src-tauri/target/release/bundle"
          echo "looking under $root"
          sigs=$(find "$root" -name '*.sig' | wc -l | tr -d ' ')
          find "$root" -name '*.sig' -print
          if [ "$sigs" -eq 0 ]; then
            echo "::error::No .sig produced — updater artifacts are unsigned."
            echo "Set the TAURI_SIGNING_PRIVATE_KEY secret (and"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD, empty string if the key has none)."
            exit 1
          fi
          echo "$sigs updater signature(s) present"

      - name: Preserve verified installer and updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canopy-${{ matrix.target }}-${{ github.sha }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
            src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 30

      # Tauri versions its filenames (Canopy_0.1.0_aarch64.dmg), but
      # `releases/latest/download/<name>` only resolves names that are identical
      # in every release. So each release also carries a version-less alias of
      # every installer — the permanent URLs canopyide.dev and the README link:
      #   https://github.com/FluidWorksApp/canopy-ide/releases/latest/download/Canopy-macos-arm64.dmg
      # Keep these names in lockstep with the website's downloads page and the
      # README table. When the Windows build lands, its alias should be
      # Canopy-windows-x86_64-setup.exe.
      - name: Upload stable-name download aliases
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          root="src-tauri/target/${{ matrix.target }}/release/bundle"
          [ -d "$root" ] || root="src-tauri/target/release/bundle"
          stage="$(mktemp -d)"
          version="$(node -p 'require("./package.json").version')"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              cp "$root"/dmg/Canopy_*.dmg "$stage/Canopy-macos-arm64.dmg" ;;
            x86_64-apple-darwin)
              cp "$root"/dmg/Canopy_*.dmg "$stage/Canopy-macos-intel.dmg" ;;
            x86_64-unknown-linux-gnu)
              cp "$root/appimage/Canopy_${version}_amd64.AppImage" "$stage/Canopy-linux-x86_64.AppImage"
              cp "$root/deb/Canopy_${version}_amd64.deb"          "$stage/Canopy-linux-x86_64.deb"
              cp "$root/rpm/Canopy-${version}-1.x86_64.rpm"          "$stage/Canopy-linux-x86_64.rpm" ;;
            x86_64-pc-windows-msvc)
              cp "$root"/nsis/*-setup.exe   "$stage/Canopy-windows-x86_64-setup.exe" ;;
            *) echo "::error::unmapped target ${{ matrix.target }} — no stable-name alias"; exit 1 ;;
          esac
          ls -l "$stage"
          # The release is still a draft at this point; gh resolves drafts by
          # tag name. --clobber makes a re-run of the workflow idempotent.
          gh release upload "${{ github.ref_name }}" "$stage"/* --clobber
          rm -rf "$stage"

  finalize:
    name: Verify complete release before publication
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify all assets, repair complete updater manifest, then optionally publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANOPY_RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-assets.mjs ${{ inputs.publish && '--publish' || '' }}

  # Workspaces move with the app version that needs them: make this tag's
  # commit the active workspace host release. The image workflow on main
  # registers it; this waits up to 30 minutes for that to finish.
  activate-workspace-host:
    name: Activate the workspace host release
    needs: finalize
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The host comparison reads the previous tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # An app-only release keeps the active host. Any doubt activates.
      - name: Activate this tag's revision if its host changed
        env:
          REVISION: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          if node scripts/workspace-host-fingerprint.mjs unchanged "$TAG"; then
            echo "Keeping the active workspace host."
            exit 0
          fi
          node scripts/workspace-host-release.mjs activate "$REVISION" "${TAG#v}"
