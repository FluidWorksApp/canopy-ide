# Runs the test suites and static checks on every pull request and on pushes to
# main. Separate from release.yml (which only fires on a tag): this is the
# red-green gate contributors see before merge, and it never builds installers
# or touches signing secrets.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-flight run when a new commit is pushed to the same PR/branch —
# the older result is already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck · lint · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: node --test scripts/release-assets.test.mjs scripts/workspace-host-release.test.mjs scripts/workspace-host-fingerprint.test.mjs
      - name: Install runtime search dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run test --workspace @canopy/remote-host
      - run: npm run test --workspace @canopy/remote-edge

  remote-host-linux:
    name: Portable Linux host (real PTY · isolation · desktop · LSP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node packages/remote-host/prepare-hook-build.mjs
      - run: node packages/remote-host/prepare-browser-build.mjs
      - run: docker build -t canopy-workspace:0.1.0 packages/remote-host
      - run: node packages/remote-host/smoke-linux.mjs

  # THIRD-PARTY-NOTICES.md is what discharges the attribution conditions of the
  # MIT/BSD/ISC/Apache dependencies Canopy redistributes, so letting it go stale
  # is a compliance bug rather than a docs nit. Regenerating and diffing catches
  # a dependency that arrived without its notice.
  #
  # Needs both toolchains — the generator reads `cargo metadata` and node_modules
  # — but compiles nothing, so it skips the webkit/ALSA system packages the rust
  # job installs. `cargo metadata` reports every platform's dependencies
  # regardless of host, so a file generated on macOS still matches here.
  licenses:
    name: Third-party notices (up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run licenses:check

  canopy-core:
    name: Harness core (no Tauri or system webview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: canopy-core
      - run: cargo test --locked --manifest-path crates/canopy-core/Cargo.toml -p canopy-core
      - run: cargo fmt --manifest-path crates/canopy-core/Cargo.toml -p canopy-core --check
      - run: cargo test --locked --manifest-path crates/canopy-service/Cargo.toml -p canopy-service
      - run: cargo fmt --manifest-path crates/canopy-service/Cargo.toml -p canopy-service --check

  pty-host:
    name: PTY host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung host test must fail the job, not hold the runner for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows runs the real host: named pipe, ConPTY and Job Objects.
        os: [ubuntu-latest, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: pty-host-${{ matrix.os }}
      - run: cargo test --locked --manifest-path crates/canopy-pty-host/Cargo.toml -p canopy-pty-host
      - run: cargo fmt --manifest-path crates/canopy-pty-host/Cargo.toml -p canopy-pty-host --check
      # A Linux container wants one static file with a configurable socket path.
      - name: Static (musl) host binary
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-unknown-linux-musl --manifest-path crates/canopy-pty-host/Cargo.toml --bin canopy-pty-host
          bin=src-tauri/target/x86_64-unknown-linux-musl/release/canopy-pty-host
          file "$bin"
          # static and static-pie report differently from ldd and file
          if file "$bin" | grep -q "statically linked\|static-pie" || ldd "$bin" 2>&1 | grep -q "not a dynamic executable\|statically linked"; then echo static; else ldd "$bin"; exit 1; fi
          # Runs, takes its socket from the environment, and creates it.
          dir=$(mktemp -d)
          CANOPY_PTY_HOST_SOCKET="$dir/h.sock" "$bin" --idle-secs 5 &
          for _ in $(seq 50); do [ -S "$dir/h.sock" ] && break; sleep 0.1; done
          [ -S "$dir/h.sock" ]

  # Each terminal crate is its own workspace root with its own Cargo.lock, so
  # tracks adding dependencies never touch the app's lock or each other.
  terminal-crates:
    name: Terminal crates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Every crates/canopy-term-* crate is its own workspace root with its own
      # lock. Found by glob, so a new crate needs no edit here. The CLI crate
      # has its own job.
      - name: List terminal crates
        id: crates
        shell: bash
        run: |
          list=$(ls -d crates/canopy-term-*/ | sed 's#/$##' | grep -v '^crates/canopy-term-cli$' | sort)
          echo "Crates: $list"
          { echo 'dirs<<EOF'; echo "$list"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.crates.outputs.dirs }}
          key: term-${{ matrix.os }}
      - name: Test and format each crate
        shell: bash
        env:
          DIRS: ${{ steps.crates.outputs.dirs }}
        run: |
          for dir in $DIRS; do
            echo "::group::$dir"
            cargo test --locked --manifest-path "$dir/Cargo.toml"
            cargo fmt --manifest-path "$dir/Cargo.toml" --check
            echo "::endgroup::"
          done

  # canopy-term-core on libghostty-vt (feature `ghostty`, off by default). Separate
  # from the job above because the engine's build script runs `zig build`, so it
  # needs the pinned Zig, and it needs network (a git clone of ghostty at the
  # crate's pinned commit and Zig package fetches); the offline build and
  # Windows are proven elsewhere. Runs the same engine-agnostic suites that the
  # job above runs for the default engine, plus the ghostty-only tests.
  terminal-ghostty:
    name: Terminal crates (ghostty feature) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            zig_target: x86_64-linux
            zig_sha256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
          - os: macos-15
            zig_target: aarch64-macos
            zig_sha256: 3cc2bab367e185cdfb27501c4b30b1b0653c28d9f73df8dc91488e66ece5fa6b
    env:
      # libghostty-vt-sys 0.2.2 pins ghostty a887df42; its build.zig.zon needs
      # Zig 0.15.2 (major.minor must match). Official ziglang.org release; the
      # checksums are from https://ziglang.org/download/index.json.
      ZIG_VERSION: 0.15.2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Zig ${{ env.ZIG_VERSION }} (official release, checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          f="zig-${{ matrix.zig_target }}-${ZIG_VERSION}.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://ziglang.org/download/${ZIG_VERSION}/$f"
          echo "${{ matrix.zig_sha256 }}  $RUNNER_TEMP/$f" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: |
          echo "zig $(zig version)"
          rustc --version
          cargo --version
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/canopy-term-core
          key: term-ghostty-${{ matrix.os }}
      - name: Test canopy-term-core with the ghostty feature
        run: >
          cargo test --locked --manifest-path crates/canopy-term-core/Cargo.toml
          --features ghostty --no-fail-fast --lib --test screen --test conformance --test fuzz --test ghostty

  term-cli:
    name: canopy-term (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./crates/canopy-term-cli -> target
          key: term-cli-${{ matrix.os }}
      - name: Build the host the tests start
        if: runner.os != 'Windows'
        run: |
          cargo build --locked --manifest-path crates/canopy-pty-host/Cargo.toml --bin canopy-pty-host
          echo "CANOPY_PTY_HOST_EXE=$GITHUB_WORKSPACE/src-tauri/target/debug/canopy-pty-host" >> "$GITHUB_ENV"
      - run: cargo test --locked --manifest-path crates/canopy-term-cli/Cargo.toml
      - run: cargo fmt --manifest-path crates/canopy-term-cli/Cargo.toml --check

  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The lib links against the system webview and ALSA even for a test build
      # (tauri + cpal are non-optional deps of the crate graph), so the same
      # floor of system packages release.yml installs is needed here.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            build-essential \
            curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # tauri-build checks that externalBin paths exist before it emits metadata,
      # even for `cargo test`. The real binary is built by prepare-sidecar.mjs
      # (release-only). A zero-byte placeholder satisfies the existence check
      # without needing the full sidecar build in CI.
      - name: Stub hook sidecar for CI
        run: |
          mkdir -p src-tauri/binaries
          triple=$(rustc -vV | grep '^host:' | awk '{print $2}')
          touch "src-tauri/binaries/canopy-hook-${triple}"


      # Dictation (ONNX Runtime) is compiled OUT here: staging the runtime is
      # release-only machinery, the feature has no logic these unit tests cover,
      # and --no-default-features is the exact configuration the Intel-macOS
      # release already ships and builds green. Tests exercise the pure git/relay/
      # cli/pty logic, none of which is behind the dictation feature.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --no-default-features

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all --check

      # Warnings only for now — turning them into errors (-D warnings) is a
      # follow-up once the existing tree is clippy-clean, so a first CI run
      # isn't blocked on pre-existing lints unrelated to a given PR.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --no-default-features --all-targets || true

  containment-platforms:
    name: Containment compile/unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: containment-${{ matrix.os }}

      # tauri-build resolves the configured external binary even for a unit
      # test. Windows requires the native .exe suffix; macOS does not.
      - name: Stub hook sidecar for platform compile
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          triple=$(rustc -vV | awk '/^host:/ { print $2 }')
          suffix=""
          if [[ "${RUNNER_OS}" == "Windows" ]]; then suffix=".exe"; fi
          touch "src-tauri/binaries/canopy-hook-${triple}${suffix}"

      - name: Compile native remote desktop application library
        working-directory: src-tauri
        # Compile coverage only. Real capture, permissions and input injection
        # still require manual tests on physical Windows and macOS machines.
        run: cargo check --no-default-features --features desk-native --lib

      - name: Compile containment launcher
        working-directory: src-tauri
        run: cargo check --no-default-features --bin canopy-hook

      - name: Run hosted-terminal glue tests (macOS)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo test --no-default-features --lib -- pty_hosted::tests ctx_socket::tests

      - name: Run containment unit contract
        working-directory: src-tauri
        # Unit-only Windows binaries need Common Controls v6. Keep this
        # explicit opt-in out of application and sidecar release builds.
        env:
          CANOPY_WINDOWS_TEST_MANIFEST: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: cargo test --no-default-features --lib containment::tests
