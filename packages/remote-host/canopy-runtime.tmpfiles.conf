# Shared runtime files on the /run tmpfs. Single owner: systemd-tmpfiles, run
# as root before every canopy-host start (ExecStartPre=+ in canopy-host.service)
# and at boot by the host bootstrap's copy in /etc/tmpfiles.d. No Canopy process
# creates these paths; each side only opens what already exists:
# - /run/canopy: world-traversable, root-owned, so the unprivileged gateway can
#   reach files root services publish here (warm-up and stop-preparation status).
# - resource-admission.lock: owned by root (the recovery agent requires uid 0),
#   group canopy-host so the gateway can open it, no access for anyone else.
d /run/canopy 0755 root root - -
f /run/canopy/resource-admission.lock 0660 root canopy-host - -
# - /run/canopy-relay: the gateway writes each workspace's short-lived relay
#   credential here for canopy-serviced (primary group canopy-host) to read.
d /run/canopy-relay 0750 canopy-host canopy-host - -
