# Canopy service runtime directories (installed as /etc/tmpfiles.d/canopy-service.conf).
# /run/canopy-service: admin.sock (0660, group canopy-host) and ws/<workspace>/
# agent socket directories, each bind-mounted read-only into its container.
d /run/canopy-service 0755 canopy-service canopy-host - -
d /run/canopy-service/ws 0755 canopy-service canopy-host - -
