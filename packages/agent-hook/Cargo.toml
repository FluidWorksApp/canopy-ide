[package]
name = "canopy-agent-hook"
version = "0.4.2"
edition = "2021"
publish = false

# This helper is also built inside Linux workspace images. Keeping its build
# independent avoids pulling Tauri, GTK and WebKit into the integration runtime.
[workspace]

[[bin]]
name = "canopy-hook"
path = "../../src-tauri/src/bin/canopy_hook.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
