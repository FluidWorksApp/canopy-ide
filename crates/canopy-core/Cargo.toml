[package]
name = "canopy-core"
version = "0.1.0"
description = "Tauri-free Canopy harness stores and terminal delivery"
authors = ["Cause Connect Pte Ltd <sam@fluidwords.app>"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
