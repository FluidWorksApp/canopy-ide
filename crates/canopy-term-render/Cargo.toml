[package]
name = "canopy-term-render"
version = "0.1.0"
description = "Native terminal renderer: layout, glyph atlas and damage tracking over frames"
authors = ["Cause Connect Pte Ltd <sam@fluidwords.app>"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

# Its own workspace root with its own lock: parallel work on other crates, and
# dependencies a track adds, never touch the app's Cargo.lock.
[workspace]

[dependencies]
canopy-term-core = { path = "../canopy-term-core" }
# Licences (all MIT, Apache-2.0, Zlib or OFL; no copyleft): see DESIGN.md.
wgpu = "25"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
fontdb = "0.23"
rustybuzz = "0.20"
swash = "0.2"

[dev-dependencies]
png = "0.17"
# Validates the WGSL on machines with no GPU (same major as wgpu's own naga).
naga = { version = "25", features = ["wgsl-in"] }

# Plain `main` targets so their output reaches the CI log (libtest hides the
# stdout of passing tests).
[[test]]
name = "gpu_probe"
harness = false

[[test]]
name = "golden"
harness = false

[[test]]
name = "perf_report"
harness = false

# `cargo test` builds dependencies unoptimised, which makes shaping and
# rasterising far slower than a shipping build. Optimise only the text
# dependencies (small compile cost); this crate itself stays a debug build, so
# PERF numbers are still pessimistic.
[profile.dev.package.rustybuzz]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.yazi]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3

# Profiles in a path dependency are ignored. libghostty-vt-sys (the engine behind
# canopy-term-core) picks Zig's optimize mode from the profile: debug info on
# means a Zig Debug build (slow, safety checks that abort); off gives
# ReleaseFast, which is what a release build gets.
[profile.dev.package.libghostty-vt-sys]
debug = false
