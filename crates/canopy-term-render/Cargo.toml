[package]
name = "canopy-term-render"
version = "0.1.0"
description = "Native terminal renderer: layout, glyph atlas and damage tracking over frames"
authors = ["Cause Connect Pte Ltd <sam@fluidwords.app>"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

# Its own workspace root with its own lock: parallel work on other crates, and
# dependencies a track adds, never touch the app's Cargo.lock.
[workspace]

[dependencies]
canopy-term-core = { path = "../canopy-term-core" }
# Licences (all MIT, Apache-2.0, Zlib or OFL; no copyleft): see DESIGN.md.
wgpu = "25"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
fontdb = "0.23"
rustybuzz = "0.20"
swash = "0.2"

[dev-dependencies]
png = "0.17"
# Validates the WGSL on machines with no GPU (same major as wgpu's own naga).
naga = { version = "25", features = ["wgsl-in"] }

# Plain `main` targets so their output reaches the CI log (libtest hides the
# stdout of passing tests).
[[test]]
name = "gpu_probe"
harness = false

[[test]]
name = "perf_report"
harness = false
