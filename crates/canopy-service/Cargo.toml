[package]
name = "canopy-service"
version = "0.1.0"
description = "Headless Canopy harness service for cloud hosts"
authors = ["Cause Connect Pte Ltd <sam@fluidwords.app>"]
license = "MIT"
edition = "2021"
rust-version.workspace = true
workspace = "../../src-tauri"

[lib]
name = "canopy_service"
path = "src/lib.rs"

[[bin]]
name = "canopy-serviced"
path = "src/main.rs"

[dependencies]
canopy-core = { path = "../canopy-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal"] }
axum = "0.7"
hyper = { version = "1", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
getrandom = "0.2"
hex = "0.4"
sha2 = "0.10"
hkdf = "0.12"
base64 = "0.22"
ed25519-dalek = "2"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "arithmetic", "std"] }
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"
