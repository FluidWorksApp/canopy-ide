[package]
name = "canopy-term-net"
version = "0.1.0"
description = "Transport contract for local and remote terminal sessions"
authors = ["Cause Connect Pte Ltd <sam@fluidwords.app>"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

# Its own workspace root with its own lock: parallel work on other crates, and
# dependencies a track adds, never touch the app's Cargo.lock.
[workspace]

[features]
default = ["iroh"]
iroh = ["dep:iroh", "dep:tokio"]

[dependencies]
# tls-ring is required: with no crypto provider an endpoint cannot be built.
iroh = { version = "1.4.1", optional = true, default-features = false, features = ["tls-ring"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "time"] }

getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
