[package]
name = "perf-compare"
version = "0.0.0"
description = "Measurement only: canopy-term-core Screen::advance on the same stream and read sizes as the libghostty-vt spike bench"
license = "MIT"
edition = "2021"
publish = false

# Its own workspace root with its own lock, outside the `crates/canopy-term-*`
# glob that the `Terminal crates` job builds.
[workspace]

# `ghostty` builds the GhosttyScreen bench (needs Zig 0.15.2, like the spike).
# Off by default so `ours` builds without Zig.
[features]
ghostty = ["canopy-term-core/ghostty", "dep:libghostty-vt"]

[dependencies]
canopy-term-core = { path = "../canopy-term-core", features = ["screen"] }
# Same pin as canopy-term-core; only used by `gscreen bare` (a callgrind target
# for the bare vt_write loop).
libghostty-vt = { version = "=0.2.2", optional = true }

[[bin]]
name = "ours"
path = "src/main.rs"

[[bin]]
name = "gscreen"
path = "src/gscreen.rs"
required-features = ["ghostty"]

# Same as the spike's `current` and `ghostty` bins: plain release.
[profile.release]
opt-level = 3
