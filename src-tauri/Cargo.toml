[package]
name = "canopy"
version = "0.2.18"
description = "Local-first, memory-light, vibe-coding-first IDE"
authors = ["Cause Connect Pte Ltd <sam@fluidwords.app>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
# The crate ships two binaries (the app + the hook helper), so `cargo run` —
# which `tauri dev` uses — must be told which one is the app.
default-run = "canopy"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Standalone helper the agent-CLI hooks invoke. Kept out of the app binary so a
# hook costs a ~1ms process start, not a whole Tauri runtime.
[[bin]]
name = "canopy-hook"
path = "src/bin/canopy_hook.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
# Voice dictation pulls the whole local-ASR + ONNX Runtime stack. It's compiled
# out of any target without a compatible ONNX Runtime — chiefly Intel macOS,
# whose last available ONNX Runtime is 1.23.0, below the >= v1.24 that ort
# requires (a lower one deadlocks ort's init). Default-on; the Intel build
# passes --no-default-features, ships the IDE without dictation, and pulls none
# of the ASR deps. lib.rs swaps in dictation_stub.rs when this is off.
default = ["dictation"]
# Serve the frontend out of the binary instead of the dev server. `tauri build`
# turns this on itself; a plain `cargo build` does not, and without it a debug
# binary points at http://localhost:5173 and runs whatever happens to be there.
# The selftest (and the CI job that runs it) builds with it for exactly that
# reason: it must test the frontend it was built with.
custom-protocol = ["tauri/custom-protocol"]
dictation = [
    "dep:transcribe-rs",
    "dep:ort",
    "dep:cpal",
    "dep:rubato",
    "dep:flate2",
    "dep:tar",
]

[dependencies]
# io-util: the MCP client reads its stdio servers a line at a time (AsyncBufReadExt).
# rt-multi-thread: Tauri already builds its shared runtime multi-threaded, but
# `blocking::io` names `tokio::task::block_in_place`, which only exists behind
# this feature — relying on Tauri's own feature set to enable it would compile
# today and break the day Tauri changes it.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util"] }
# Canopy Remote: an embedded HTTP + WebSocket server that serves the mobile
# control portal and bridges it to the local command surface (projects, agent
# status, PTY I/O). axum is the tokio-native choice and reuses the runtime Tauri
# already runs; include_dir bakes the built portal SPA into the binary so it
# ships offline with no runtime asset-path resolution.
axum = { version = "0.7", features = ["ws"] }
# Team relay over WebSocket: the relay's transport-agnostic crypto rides a
# WebSocket so a team session travels the SAME axum ingress — and thus the same
# LAN URL or active tunnel — as Canopy Remote (one endpoint, two PIN-gated
# routes). tokio-tungstenite is the join-side dial (wss through the tunnel); the
# host side upgrades axum's own WebSocket. rustls-webpki-roots so public tunnel
# certs (Cloudflare / ngrok) validate; futures-util drives the sink/stream.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
include_dir = "0.7"
# Preview proxy: the raw-byte WebSocket tunnel (dev-server HMR through the
# in-app browser) needs hyper's upgrade types and hyper-util's Tokio IO shim.
# Both are already in the tree under axum, so this adds names, not weight.
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# A scannable QR of the portal URL so pairing a phone is "scan + type the PIN".
# Pure-Rust encoder; the SVG is hand-built from the matrix (no render feature).
qrcode = { version = "0.14", default-features = false }
# rustls (ring provider) is installed process-wide at startup so tokio-tungstenite's
# wss:// connector — the team relay's internet transport through a tunnel — has a
# default crypto provider. No direct rustls types are used beyond that install.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# PTY: cross-platform pseudo-terminal, the core of the terminal feature
portable-pty = "0.9"
# File watching for external-change detection (diff-first workflow)
notify = "8"
# .gitignore semantics for the file walk behind quick-open, find-in-files and
# SpotSearch (fsx.rs). ripgrep's own crate rather than a hand-rolled matcher:
# negations, directory-only patterns, nested and global ignore files and
# .git/info/exclude are all things a project's .gitignore actually uses, and
# getting any of them wrong shows up as a file that cannot be found.
ignore = "0.4"
# Process-tree inspection for the runaway guard + agent detection
sysinfo = "0.33"
trash = "5.2.3"
# Relay encryption: SPAKE2 turns the low-entropy join code into a strong,
# mutually-authenticated session key (magic-wormhole's approach); HKDF splits
# it per-direction; ChaCha20-Poly1305 is the AEAD on the wire; SHA-256 both
# derives keys and integrity-checks transferred files. All pure-Rust RustCrypto
# — the relay transport itself stays std::net, no async/TLS stack pulled in.
sha2 = "0.10"
spake2 = "0.4"
hkdf = "0.12"
chacha20poly1305 = "0.10"
# Compact text encoding for binary file chunks tunnelled as JSON relay frames.
base64 = "0.22"
# The browser credential vault (vault.rs). Argon2id turns the user's passphrase
# into a key — memory-hard, so a stolen vault file is not a wordlist away from
# opening — and zeroize wipes that key and the secrets it protected when the
# vault locks, rather than leaving them in a freed allocation. The AEAD itself
# (XChaCha20-Poly1305) and the CSPRNG are already here for the relay.
argon2 = "0.5"
zeroize = "1"
# Importing an existing password set. KDBX is the format every other manager
# exports — KeePassXC, Bitwarden, 1Password, Strongbox — so reading it is the
# difference between "start typing your logins in again" and "bring them over".
# Read only: the crate's KDBX writing is marked experimental, and the file that
# holds someone's passwords is not the place to find out what that means. The
# writing feature is enabled for dev only, so the tests can build a real
# database to parse instead of checking in an opaque binary fixture.
keepass = { version = "0.13", default-features = false }
# SpotSearch's persistent index (spot.rs): FTS5 over agent transcripts and
# terminal scrollback. Bundled so the shipped app never depends on the OS
# sqlite (macOS's system copy predates the FTS5 fixes we rely on) — it compiles
# in statically, same notarisation story as any other Rust code.
rusqlite = { version = "0.32", features = ["bundled"] }
# OS CSPRNG for per-transfer key-derivation salts (nonce separation across
# file-transfer retries). Already present transitively via spake2/rand_core.
getrandom = "0.2"
# Long-term identity keys for trust-on-first-use: each Canopy signs its relay
# session with an Ed25519 key so a reused join code can't silently impersonate
# a teammate across sessions.
ed25519-dalek = "2"
hex = "0.4"
# Voice dictation: local ASR (Parakeet / SenseVoice / Moonshine) via ONNX
# Runtime. All of `dictation`-feature-gated (optional): cpal captures the mic,
# rubato resamples to the model's 16 kHz, reqwest streams the one-time model
# download, and flate2+tar unpack the .tar.gz model bundles. The Intel-macOS
# build turns the feature off and pulls none of this.
transcribe-rs = { version = "0.3.11", default-features = false, features = ["onnx"], optional = true }
# ONNX Runtime is loaded dynamically wherever dictation is enabled, from a
# libonnxruntime shipped in the app bundle (release.yml fetches Microsoft's
# official v1.24.x build; lib.rs points ORT_DYLIB_PATH at it). load-dynamic
# sidesteps the static prebuilt's failures — chiefly the Linux prebuilt linking
# against a too-new glibc (undefined `__isoc23_strtol` on ubuntu-22.04) — by
# never linking ONNX at build time. The runtime must be >= v1.24: ort rc.12's
# default api-24 feature demands it, and a lower one deadlocks ort's init. Intel
# macOS has no such build (nothing past v1.23.0), so it compiles dictation out
# entirely rather than ship a broken engine. Exact-pinned to unify with
# transcribe-rs's ort.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic"], optional = true }
cpal = { version = "0.16", optional = true }
rubato = { version = "0.16", optional = true }
# Non-optional: dictation streams model downloads through it, and opt-in crash
# reporting POSTs its payload from the backend (CORS-proof, unlike a webview
# fetch to an arbitrary collector).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Native notifications for team-relay activity while the app is unfocused
tauri-plugin-notification = "2"

# Unix signals for killing whole PTY process groups (no zombies)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# canopy_screenshot: the webview's own snapshot API, so capturing our own window
# needs no Screen Recording permission. Same objc2 generation wry already links,
# so this adds bindings, not a second Objective-C runtime.
[target.'cfg(windows)'.dependencies]
# Reaching CoreWebView2's settings to switch Edge's own keyboard shortcuts off
# (webview_keys.rs). Both versions are pinned to what webview2-com-sys already
# resolves to, so this adds no new crate to the graph — it only names two that
# Tauri already builds on Windows.
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSValue", "NSGeometry", "NSDictionary", "NSString", "NSError", "NSData"] }
# NSPasteboard is clipboard.rs's whole native surface — a changeCount poll and
# one string read per copy. A feature on the crate already here rather than a
# clipboard dependency: tauri-plugin-clipboard-manager can only read on demand
# from the webview's ACL, which is exactly what a history cannot be built on.
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSColor", "NSResponder", "NSView", "NSPasteboard"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2"] }
# Click-aware notifications (notify.rs). The same crate tauri-plugin-notification
# already pulls in through notify-rust, so this unifies rather than adding a
# second notification stack — but reaching it directly is the only way to learn
# that a notification was clicked, which is what deep links are routed on.
mac-notification-sys = "0.6"

# Release builds took cargo's defaults until now: no LTO, 16 codegen units. The
# app's own crate is ~33k lines against a very large dependency graph, so most
# of what ships is cross-crate code that thin LTO can inline and dead-strip —
# which is binary size and startup work, both of which SPEC's 60-150 MB idle
# target cares about. `codegen-units = 1` is the same trade in the other
# direction: a slower release build for a smaller, faster binary. Neither
# changes behaviour, and debug/dev builds are untouched, so `tauri dev` is as
# fast as it was.
[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
keepass = { version = "0.13", default-features = false, features = ["save_kdbx4"] }
# `test` feature enables tauri::test::mock_app for exercising PTY spawn/attach
# against a mock runtime. Dev-only, so the release build is unaffected.
tauri = { version = "2.11.3", features = ["test", "unstable"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
